syntax = "proto3";

package ledger.v1;

option csharp_namespace = "RefundLedger.Contracts.V1";

service LedgerService {
  // Идемпотентен по refund_id. Тот же id с другим телом — FAILED_PRECONDITION.
  rpc RegisterRefund(RegisterRefundRequest) returns (RefundReply);
  rpc GetRefund(GetRefundRequest) returns (RefundReply);
  // Новая выплата вместо отклонённой. Ключ у платёжки при этом новый.
  rpc RetryPayout(RetryPayoutRequest) returns (RefundReply);
  // Начисление продавцу за продажу. Идемпотентно по operation_id.
  rpc CreditSeller(CreditSellerRequest) returns (CreditSellerReply);
  rpc GetBalance(GetBalanceRequest) returns (BalanceReply);
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesReply);
}

// Сумма в минимальных единицах валюты: копейки, а не double.
message Money {
  int64 minor = 1;
  string currency = 2;
}

message RegisterRefundRequest {
  string refund_id = 1;
  int64 buyer_id = 2;
  int64 seller_id = 3;
  Money amount = 4;
}

message GetRefundRequest { string refund_id = 1; }

message RetryPayoutRequest { string refund_id = 1; }

enum RefundStatus {
  REFUND_STATUS_UNSPECIFIED = 0;
  REFUND_STATUS_PAYOUT_IN_PROGRESS = 1;
  REFUND_STATUS_PAID = 2;
  REFUND_STATUS_PAYOUT_REJECTED = 3;
}

message RefundReply {
  string refund_id = 1;
  RefundStatus status = 2;
  Money amount = 3;
  // Сколько удержано с продавца и сколько маркетплейс взял на себя.
  Money seller_part = 4;
  Money platform_part = 5;
}

message CreditSellerRequest {
  string operation_id = 1;
  int64 seller_id = 2;
  Money amount = 3;
}

message CreditSellerReply { bool duplicate = 1; }

message GetBalanceRequest { string account_code = 1; }

message BalanceReply { Money balance = 1; }

message ListEntriesRequest {
  string account_code = 1;
  int32 page_size = 2;
  // Значение next_cursor прошлой страницы; 0 — с самых свежих.
  int64 cursor = 3;
}

message Entry {
  int64 id = 1;
  string posting_key = 2;
  Money amount = 3;
  int64 booked_at_unix_ms = 4;
}

message ListEntriesReply {
  repeated Entry entries = 1;
  int64 next_cursor = 2;
}
