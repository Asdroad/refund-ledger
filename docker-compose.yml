x-app-env: &app-env
  ConnectionStrings__Postgres: Host=postgres;Database=ledger;Username=ledger;Password=ledger
  ConnectionStrings__Redis: redis:6379
  Kafka__BootstrapServers: kafka:9092
  Psp__BaseUrl: http://psp:5080
  Otlp__Traces: http://jaeger:4317
  Otlp__Metrics: http://prometheus:9090/api/v1/otlp/v1/metrics

services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: ledger, POSTGRES_USER: ledger, POSTGRES_PASSWORD: ledger }
    ports: ["127.0.0.1:5432:5432"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "ledger"], interval: 2s, retries: 30 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports: ["127.0.0.1:6379:6379"]

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports: ["127.0.0.1:29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 5s
      retries: 30

  kafka-topics:
    image: apache/kafka:3.9.1
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in returns.refund-approved.v1 returns.refund-approved.v1.dlq ledger.refund-events.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 6
        done

  migrate:
    build: { context: ., args: { PROJECT: RefundLedger.Worker } }
    command: ["--migrate"]
    environment: *app-env
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { context: ., args: { PROJECT: RefundLedger.Api } }
    environment: *app-env
    ports: ["127.0.0.1:5001:5001", "127.0.0.1:8081:8081"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    build: { context: ., args: { PROJECT: RefundLedger.Worker } }
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka-topics: { condition: service_completed_successfully }

  psp:
    build: { context: ., args: { PROJECT: RefundLedger.PspStub } }
    environment: { Mode: ok }
    ports: ["127.0.0.1:5080:5080"]

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    ports: ["127.0.0.1:16686:16686"]

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-otlp-receiver"]
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:11.5.2
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer }
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
